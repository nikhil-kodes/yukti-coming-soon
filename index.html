  <!-- Font imports -> We will use Helvetica/Arial as requested since no external fonts were provided -->
  <style>
    @font-face {
      font-family: 'Reference Sans';
      src: local('Helvetica Neue'), local('Arial');
    }
    @font-face {
      font-family: 'Reference Display';
      src: local('Helvetica Neue'), local('Arial');
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    .viewport {
      position: absolute;
      inset: 0;
      isolation: isolate;
      background: #000;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
      
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
    }

    /* HEADER */
    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      z-index: 10;
    }

    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    
    .brand-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #ededed;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-text {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.3px;
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
    }

    .header-actions {
      display: flex;
      flex: 1;
      align-items: center;
    }

    .nav {
      margin-left: clamp(36px, 3.03vw, 48px);
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      display: flex;
    }

    .nav a {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229,229,230,.77);
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      text-decoration: none;
      position: relative;
      transition: filter 140ms, opacity 140ms;
    }

    .nav a:hover {
      filter: brightness(1.08);
      color: #fff;
    }

    .nav a.active {
      color: #fff;
    }

    .nav a:last-child {
      margin-left: 1px;
    }

    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230,230,230,.52);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240,240,240,.77);
    }

    .time-value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255,255,255,.93);
    }

    .sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-weight: 460;
      letter-spacing: -.34px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
      margin-left: auto;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 140ms, opacity 140ms;
      text-decoration: none;
      box-sizing: border-box;
    }
    
    .sign-up:hover {
      filter: brightness(1.08);
    }

    .menu-toggle {
      display: none;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.13);
      backdrop-filter: blur(14px) saturate(108%);
      cursor: pointer;
    }

    /* HERO */
    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 5;
    }

    .hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -2px;
      -webkit-text-stroke: .12px currentColor;
      text-shadow: 0 2px 2px rgba(0,0,0,.44);
      margin: 0 0 var(--title-copy-gap) 0;
      line-height: 1.1;
      font-size: clamp(42px, 8vw, 88px);
      max-width: 100%;
    }

    .hero-title .line {
      display: block;
      overflow: hidden;
      transform-origin: left center;
    }

    .hero-title .line-reveal {
      display: block;
    }

    .line-one {
      color: #fff;
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
    }

    .hero-copy {
      color: rgba(226, 229, 228, .84);
      font-weight: 350;
      letter-spacing: .13px;
      width: 100%;
      max-width: 500px;
      margin: 0 0 var(--copy-cta-gap) 0;
      position: relative;
      left: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      transform: translateY(var(--copy-optical-shift));
    }

    .primary-cta {
      position: relative;
      width: clamp(200px, 22vw, 240px);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      border: none;
      cursor: pointer;
      padding: 0 6px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: filter 140ms;
      text-decoration: none;
    }

    .primary-cta:hover {
      filter: brightness(1.08);
    }

    .primary-cta .label {
      font-weight: 500;
      letter-spacing: -.3px;
      font-size: var(--primary-control-font-size);
      white-space: nowrap;
    }

    .primary-cta .arrow-box {
      height: calc(100% - 12px);
      aspect-ratio: 1 / 1;
      border-radius: 5px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* DEMO CARD */
    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      box-shadow:
        0 2px 10px rgba(0,0,0,.44),
        0 0 0 3px rgba(255,255,255,.035) inset,
        0 0 0 1px rgba(0,0,0,.9);
      backdrop-filter: blur(14px) saturate(108%);
      z-index: 5;
    }

    .demo-visual {
      position: absolute;
      left: 3.5cqw;
      top: 4cqw;
      width: 92.5cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-visual .thumbnail {
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #441a1a, #1a1a44);
      filter: brightness(.89) saturate(.93) contrast(1.03);
    }

    .demo-visual .play {
      position: absolute;
      width: 29cqw;
      height: 29cqw;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(3,5,7,.47);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: filter 140ms;
    }
    
    .demo-visual .play:hover {
      filter: brightness(1.2);
    }

    .watch-button {
      position: absolute;
      left: 3.5cqw;
      bottom: 4cqw;
      width: 92.5cqw;
      height: 24cqw;
      border-radius: 4cqw;
      background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
      border: 1px solid rgba(255,255,255,.21);
      color: #fff;
      font-weight: 430;
      font-size: 11cqw;
      cursor: pointer;
      transition: filter 140ms;
    }

    .watch-button:hover {
      filter: brightness(1.1);
    }

    /* ANIMATIONS (reduced-motion check) */
    @media (prefers-reduced-motion: no-preference) {
      .motion-pending .brand { opacity: 0; animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards; }
      
      .motion-pending .nav a:nth-child(1) { opacity: 0; animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms forwards; }
      .motion-pending .nav a:nth-child(2) { opacity: 0; animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms forwards; }
      .motion-pending .nav a:nth-child(3) { opacity: 0; animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms forwards; }
      .motion-pending .nav a:nth-child(4) { opacity: 0; animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms forwards; }
      
      .motion-pending .time-panel { opacity: 0; animation: entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms forwards; }
      .motion-pending .sign-up { opacity: 0; animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards; }
      .motion-pending .menu-toggle { opacity: 0; animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards; }
      
      .motion-pending .hero-title .line { overflow: hidden; }
      .motion-pending .line-one .line-reveal { 
        transform: translate3d(0,110%,0) skewY(2deg); 
        animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards; 
      }
      .motion-pending .line-two .line-reveal { 
        transform: translate3d(0,110%,0) skewY(2deg); 
        animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards; 
      }
      
      .motion-pending .hero-copy { 
        opacity: 0; 
        transform: translate3d(0, 10px, 0) scale(0.98);
        animation: entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms forwards; 
      }
      
      .motion-pending .primary-cta { 
        opacity: 0; 
        animation: entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms forwards; 
      }
      
      .motion-pending .demo-card { 
        opacity: 0; 
        transform-origin: 82% 50%;
        animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards; 
      }
    }

    @keyframes entrance-brand {
      0% { opacity: 0; transform: translateY(7px) scale(.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    @keyframes entrance-nav {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes entrance-action {
      0% { opacity: 0; transform: translateY(8px) scale(.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes entrance-line {
      0% { transform: translate3d(0,110%,0) skewY(2deg); }
      100% { transform: translate3d(0,0,0) skewY(0); }
    }

    @keyframes entrance-copy {
      0% { opacity: 0; transform: translate3d(0, 10px, 0) scale(0.98); }
      100% { opacity: 1; transform: translate3d(0, var(--copy-optical-shift), 0) scale(1); }
    }

    @keyframes entrance-card {
      0% { opacity: 0; transform: translateY(12px) scale(.968); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* RESPONSIVE: Tablet & Mobile */
    @media (max-width: 950px) {
      
      .header-actions {
        position: absolute;
        top: 60px;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
        border: 1px solid rgba(255,255,255,.13);
        backdrop-filter: blur(18px) saturate(108%);
        border-radius: 16px;
        width: min(340px, calc(100vw - 2*var(--gutter-start)));
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 300ms, transform 300ms, visibility 300ms;
        z-index: 20;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        width: 46px;
        height: 46px;
        border-radius: 11px;
        z-index: 21;
      }

      .nav {
        flex-direction: column;
        margin-left: 0;
        gap: 20px;
      }

      .sign-up {
        margin-left: 0;
        width: 100%;
        margin-top: 24px;
      }

      .hero-content {
        bottom: clamp(24px, 5vh, 40px);
      }
    }

    @media (max-width: 480px) {
      .hero-copy br {
        display: none;
      }
    }
  </style>

    <section class="screen" id="screen">
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">

        <div class="header-actions" id="tablet-navigation">
          <nav class="nav">

            <a href="https://www.linkedin.com/company/yuktikula-club/">LinkedIn</a>

        <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M4 8h16M4 16h16"/>
          </svg>
        </button>
      </header>
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">
            <span class="line line-one"><span class="line-reveal">Something is</span></span>
            <span class="line line-two"><span class="line-reveal">cooking.</span></span>
          </h1>
          <p class="hero-copy">
            The official CSE (Data Science) club at<br>
            GL Bajaj Institute of Technology and Management.<br>
            JOAT is coming soon.
          </p>
          <a href="https://joat.yuktikulaglb.in" class="primary-cta">
            <span class="label">JOAT is coming</span>
            <span class="arrow-box">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
          </a>
        </div>
      </section>
    </section>
  </main>
  
  <script>
    // Disable right-clicking
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.documentElement.classList.remove('motion-pending');
      }, 3500);

      const cta = document.querySelector('.primary-cta');
      if (cta) {
        cta.addEventListener('animationend', (e) => {
          if (e.animationName === 'entrance-action') {
            document.documentElement.classList.remove('motion-pending');
          }
        });
      }

      const menuToggle = document.querySelector('.menu-toggle');
      const header = document.querySelector('.header');
      const navActions = document.getElementById('tablet-navigation');
      
      menuToggle.addEventListener('click', () => {
        header.classList.toggle('menu-open');
        const isOpen = header.classList.contains('menu-open');
        menuToggle.setAttribute('aria-expanded', isOpen);
        if (isOpen) {
          navActions.removeAttribute('inert');
        } else {
          navActions.setAttribute('inert', '');
        }
      });
      
      // Handle inert state initially on mobile
      const mql = window.matchMedia('(max-width: 950px)');
      const handleResize = (e) => {
        if (e.matches && !header.classList.contains('menu-open')) {
          navActions.setAttribute('inert', '');
        } else {
          navActions.removeAttribute('inert');
        }
      };
      mql.addEventListener('change', handleResize);
      handleResize(mql);
    });
  </script>
