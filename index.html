    @keyframes entrance-nav { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

    @keyframes entrance-copy { 0% { opacity: 0; transform: translate3d(0, 10px, 0) scale(0.98); } 100% { opacity: 1; transform: translate3d(0, var(--copy-optical-shift), 0) scale(1); } }

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.documentElement.classList.remove('motion-pending'), 3500);

      const cta = document.querySelector('.primary-cta');
      if (cta) cta.addEventListener('animationend', e => {
        if (e.animationName === 'entrance-action') document.documentElement.classList.remove('motion-pending');
      });

      const menuToggle = document.querySelector('.menu-toggle');
      const header = document.querySelector('.header');
      const navActions = document.getElementById('tablet-navigation');

      menuToggle.addEventListener('click', () => {
        header.classList.toggle('menu-open');
        const isOpen = header.classList.contains('menu-open');
        menuToggle.setAttribute('aria-expanded', isOpen);
        if (isOpen) {
          navActions.removeAttribute('inert');
          const firstLink = navActions.querySelector('a');
          if (firstLink) firstLink.focus();
        } else {
          navActions.setAttribute('inert', '');
        }
      });

      // Close menu on Escape key
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && header.classList.contains('menu-open')) {
          header.classList.remove('menu-open');
          menuToggle.setAttribute('aria-expanded', false);
          navActions.setAttribute('inert', '');
          menuToggle.focus();
        }
      });

      // Handle inert state on resize
      const mql = window.matchMedia('(max-width: 950px)');
      const handleResize = e => {
        if (e.matches && !header.classList.contains('menu-open')) {
          navActions.setAttribute('inert', '');
        } else if (!e.matches) {
          navActions.removeAttribute('inert');
          header.classList.remove('menu-open');
        }
      };
      mql.addEventListener('change', handleResize);
      handleResize(mql);
    });
  </script>
</body>
</html>
